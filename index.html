<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f4f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="連續撥號">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>連續撥號</title>
<!-- Clean Start v1.1: metadata OCR; phone core unchanged -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root{--bg:#f4f4f6;--card:#fff;--text:#111;--muted:#7a7a80;--line:#e3e3e8;--ok:#07834d;--bad:#c5221f}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;padding-bottom:90px}
header{padding:56px 28px 28px;background:var(--bg);border-bottom:1px solid var(--line)}
h1{font-size:34px;margin:0 0 8px} .sub{color:var(--muted);font-size:18px}
main{padding:22px}.card{background:#fff;border-radius:24px;padding:22px;margin-bottom:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#fff;border-radius:20px;padding:18px 6px;text-align:center}.stat b{display:block;font-size:26px}.stat span{color:var(--muted);font-size:14px}
button,.btn{border:0;border-radius:18px;padding:16px 18px;font-size:18px;font-weight:700;background:#111;color:#fff;width:100%}
.btn2{background:#ececf0;color:#111}.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input,select{width:100%;padding:14px;border:1px solid #d8d8de;border-radius:14px;font-size:18px;background:#fff}
label{display:block;color:var(--muted);margin:0 0 8px}.hint{color:var(--muted);font-size:15px;line-height:1.5}.danger{color:var(--bad)}
.item{border:1px solid #e2e2e7;border-radius:18px;padding:16px;margin:12px 0}.item.needs{border:2px solid #d4473d}.item .tag{font-size:13px;color:#fff;background:#d4473d;border-radius:999px;padding:4px 8px;display:inline-block;margin-bottom:8px}
.item input{margin-top:8px}.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:5}
.nav button{background:transparent;color:#777;padding:10px 4px;font-size:14px}.nav button.active{color:#111}
.hidden{display:none}.nextName{font-size:34px;font-weight:800}.nextPhone{font-size:28px;margin:8px 0}.small{font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<header><h1>連續撥號</h1><div class="sub">匯入名單 → 確認 → 逐筆撥號</div></header>

<section id="pageDial">
<main>
<div class="stats">
 <div class="stat"><b id="sRemain">0</b><span>剩餘</span></div>
 <div class="stat"><b id="sToday">0</b><span>今日撥打</span></div>
 <div class="stat"><b id="sDone">0</b><span>完成</span></div>
 <div class="stat"><b id="sMiss">0</b><span>未接</span></div>
</div>
<div class="card" id="dialCard"><div class="hint">目前沒有待撥名單。</div></div>
</main>
</section>

<section id="pageList" class="hidden"><main>
<div class="card"><h2>名單</h2><div id="listWrap"></div></div>
</main></section>

<section id="pageImport" class="hidden"><main>
<div class="card">
<h2>拍照 / 選照片匯入</h2>
<label>這張名單「應該有幾筆」</label>
<input id="expectedRows" type="number" min="1" max="200" placeholder="例如 10">
<p class="hint">這是新版的核心：你填 10，就一定建立 10 列。辨識不到的電話不會消失，而是標示「電話需確認」。</p>
<div class="row2">
 <label class="btn2 btn" style="text-align:center">📷 拍照<input id="cameraInput" type="file" accept="image/*" capture="environment" hidden></label>
 <label class="btn2 btn" style="text-align:center">📁 選照片 / 檔案<input id="imageInput" type="file" accept="image/*" hidden></label>
</div>
<p id="selectedFile" class="hint">尚未選擇圖片</p>
<button id="ocrBtn">開始辨識</button>
<p id="ocrStatus" class="hint"></p>
</div>
<div class="card">
<h2>辨識結果</h2>
<div id="ocrResults"><div class="hint">尚未辨識。</div></div>
<button id="importBtn" class="hidden">加入待撥名單</button>
</div>
</main></section>

<section id="pageStats" class="hidden"><main>
<div class="card"><h2>統計</h2><div id="statsDetail" class="hint"></div></div>
</main></section>

<nav class="nav">
<button data-page="Dial" class="active">撥號</button>
<button data-page="List">名單</button>
<button data-page="Import">拍照匯入</button>
<button data-page="Stats">統計</button>
</nav>

<script>
const KEY='callqueue_clean_v1';
let data=JSON.parse(localStorage.getItem(KEY)||'{"items":[],"today":0}');
let ocrDraft=[];
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const phoneOK=p=>/^09\d{8}$/.test(p)||/^0[2-8]\d{7,8}$/.test(p);
function normalizePhone(s=''){
  let d=String(s).replace(/[OＯ〇○]/g,'0').replace(/[Il|｜]/g,'1').replace(/[Ｓs]/g,'5').replace(/[Ｂ]/g,'8').replace(/\D/g,'');
  if(d.startsWith('886')) d='0'+d.slice(3);
  return d;
}
function extractPhones(text=''){
  const out=[];
  for(const line of String(text).split(/\n+/)){
    const raw=line.replace(/[OＯ〇○]/g,'0').replace(/[Il|｜]/g,'1').replace(/[Ｓs]/g,'5').replace(/[Ｂ]/g,'8');
    const chunks=raw.match(/[0-9\-\s()（）]{8,28}/g)||[];
    for(const c of chunks){
      const d=c.replace(/\D/g,'');
      for(const len of [10,9]){
        for(let i=0;i<=d.length-len;i++){
          const p=d.slice(i,i+len);
          if(phoneOK(p)) out.push(p);
        }
      }
    }
  }
  return out;
}
function buildRowsFromPhoneSequence(phones, expected){
  // 不去重：同一電話出現兩次，就保留兩筆。
  const rows=[];
  for(let i=0;i<expected;i++){
    rows.push({
      id:uid(),
      name:'未命名',
      company:'',
      phone:phones[i]||'',
      status:'pending',
      callCount:0,
      needsCheck:!phones[i]
    });
  }
  return rows;
}
async function ocrOne(source, lang='eng', psm='6'){
  const worker=await Tesseract.createWorker(lang,1);
  try{
    await worker.setParameters({tessedit_pageseg_mode:psm,preserve_interword_spaces:'1',user_defined_dpi:'300'});
    const r=await worker.recognize(source);
    return r.data.text||'';
  }finally{try{await worker.terminate()}catch(e){}}
}
async function prepareCanvas(file){
  const bmp=await createImageBitmap(file);
  const scale=Math.min(2.5,2600/bmp.width);
  const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(bmp.width*scale)); c.height=Math.max(1,Math.round(bmp.height*scale));
  const x=c.getContext('2d',{willReadFrequently:true}); x.drawImage(bmp,0,0,c.width,c.height);
  const im=x.getImageData(0,0,c.width,c.height);
  for(let i=0;i<im.data.length;i+=4){
    const g=.299*im.data[i]+.587*im.data[i+1]+.114*im.data[i+2];
    const v=Math.max(0,Math.min(255,(g-128)*1.45+128));
    im.data[i]=im.data[i+1]=im.data[i+2]=v;
  }
  x.putImageData(im,0,0); return c;
}
async function runOCR(){
  const expected=parseInt(document.getElementById('expectedRows').value,10);
  const file=(cameraInput.files&&cameraInput.files[0])|| (imageInput.files&&imageInput.files[0]);
  const st=document.getElementById('ocrStatus');
  if(!expected||expected<1){st.textContent='請先填這張名單應該有幾筆，例如 10。';return}
  if(!file){st.textContent='請先拍照或選擇圖片。';return}
  st.textContent='辨識中，先找電話號碼…';
  try{
    const c=await prepareCanvas(file);
    const text1=await ocrOne(c,'eng','6');
    st.textContent='第二次補抓電話…';
    const text2=await ocrOne(c,'eng','11');
    const phones=[...extractPhones(text1),...extractPhones(text2)];

    // 對相同來源的重複 OCR 結果做「序列共識」，但保留名單本身的重複電話。
    // 簡化策略：依出現順序取前 expected 筆；若不足，空列保留。
    ocrDraft=buildRowsFromPhoneSequence(phones, expected);

    // 附加功能：嘗試辨識姓名/公司，但絕不改動電話筆數、電話順序或電話內容。
    st.textContent='電話已完成，正在補抓姓名 / 公司…';
    try{
      const metaText=await ocrOne(c,'chi_tra+eng','6');
      const metaLines=String(metaText).split(/\n+/).map(x=>x.trim()).filter(Boolean);
      const phoneLineIdx=[];
      for(let i=0;i<metaLines.length;i++){
        if(extractPhones(metaLines[i]).length) phoneLineIdx.push(i);
      }

      function cleanMeta(s=''){
        return s.replace(/[|｜]/g,' ').replace(/\s+/g,' ').trim();
      }
      function companyLike(s=''){
        return /(有限公司|股份有限公司|企業社|企業有限公司|公司|工業|實業|工程|科技|商行|行號|診所|事務所|協會|中心|工作室)/.test(s);
      }
      function possibleName(s=''){
        const t=s.replace(/(董事長|負責人|經理|監察人|總經理|老闆|先生|小姐)/g,'').replace(/[^\u4e00-\u9fff]/g,'');
        return t.length>=2 && t.length<=4 ? t : '';
      }

      for(let r=0;r<Math.min(expected,phoneLineIdx.length);r++){
        const idx=phoneLineIdx[r];
        const nearby=[];
        for(let d=-1;d<=1;d++){
          if(metaLines[idx+d]) nearby.push(cleanMeta(metaLines[idx+d]));
        }
        let company='', name='';
        for(const line of nearby){
          const noPhone=line.replace(/(?:09\d{8}|0[2-8]\d{7,8})/g,'').trim();
          if(!company && companyLike(noPhone)) company=noPhone;
          if(!name){
            const m=noPhone.match(/(?:董事長|負責人|經理|監察人|總經理)\s*([\u4e00-\u9fff]{2,4})/);
            if(m) name=m[1];
          }
        }
        if(!name){
          for(const line of nearby){
            const n=possibleName(line);
            if(n && !companyLike(line)){ name=n; break; }
          }
        }
        if(company) ocrDraft[r].company=company;
        if(name) ocrDraft[r].name=name;
      }
    }catch(metaErr){
      console.warn('metadata OCR skipped',metaErr);
    }

    st.textContent=`完成：固定建立 ${expected} 筆。已辨識到 ${ocrDraft.filter(x=>x.phone).length} 筆電話。姓名 / 公司為附加辨識，可直接手動修改。`;
    renderOCR();
  }catch(e){
    console.error(e);
    st.textContent='辨識引擎執行失敗。請重新整理後再試，不需要重拍。';
  }
}
function renderOCR(){
  const w=document.getElementById('ocrResults');
  if(!ocrDraft.length){w.innerHTML='<div class="hint">尚未辨識。</div>';importBtn.classList.add('hidden');return}
  w.innerHTML=ocrDraft.map((r,i)=>`
  <div class="item ${r.needsCheck?'needs':''}">
    ${r.needsCheck?'<span class="tag">電話需確認</span>':''}
    <div class="small">第 ${i+1} 筆</div>
    <input value="${r.name}" data-i="${i}" data-k="name" placeholder="姓名">
    <input value="${r.phone}" data-i="${i}" data-k="phone" placeholder="電話">
    <input value="${r.company}" data-i="${i}" data-k="company" placeholder="公司">
  </div>`).join('');
  w.querySelectorAll('input').forEach(el=>el.oninput=e=>{
    const r=ocrDraft[+e.target.dataset.i]; r[e.target.dataset.k]=e.target.value;
    if(e.target.dataset.k==='phone') r.needsCheck=!phoneOK(normalizePhone(e.target.value));
  });
  importBtn.classList.remove('hidden');
}
function importOCR(){
  for(const r of ocrDraft){
    data.items.push({...r,phone:normalizePhone(r.phone),createdAt:new Date().toISOString()});
  }
  save(); ocrDraft=[]; renderAll(); showPage('Dial');
}
function current(){return data.items.find(x=>x.status==='pending')}
function renderDial(){
  const c=current(), card=document.getElementById('dialCard');
  if(!c){card.innerHTML='<div class="hint">目前沒有待撥名單。可到「拍照匯入」新增。</div>';return}
  card.innerHTML=`<div class="small">下一位</div><div class="nextName">${c.name||'未命名'}</div>
  <div class="nextPhone">${c.phone||'電話需確認'}</div>
  <div class="small">${c.company||''}</div>
  <br><button id="callBtn" ${!phoneOK(c.phone)?'disabled style="opacity:.4"':''}>撥打 ${c.name||''}</button>
  <div class="row2" style="margin-top:12px"><button class="btn2" id="doneBtn" style="color:var(--ok)">已完成</button><button class="btn2" id="missBtn" style="color:var(--bad)">未接</button></div>
  <button class="btn2" id="laterBtn" style="margin-top:12px">稍後再打，移到最後</button>`;
  if(phoneOK(c.phone)) callBtn.onclick=()=>{c.callCount++;data.today++;save();location.href='tel:'+c.phone};
  doneBtn.onclick=()=>{c.status='done';save();renderAll()};
  missBtn.onclick=()=>{c.status='miss';save();renderAll()};
  laterBtn.onclick=()=>{const i=data.items.indexOf(c);data.items.splice(i,1);data.items.push(c);save();renderAll()};
}
function renderList(){
  listWrap.innerHTML=data.items.length?data.items.map((x,i)=>`<div class="item ${!phoneOK(x.phone)?'needs':''}">
  <b>${x.name||'未命名'}</b><div>${x.phone||'電話需確認'}</div><div class="small">${x.company||''}</div>
  <button class="btn2" style="margin-top:8px" onclick="data.items.splice(${i},1);save();renderAll()">刪除</button></div>`).join(''):'<div class="hint">目前沒有名單。</div>';
}
function renderStats(){
  const remain=data.items.filter(x=>x.status==='pending').length, done=data.items.filter(x=>x.status==='done').length, miss=data.items.filter(x=>x.status==='miss').length;
  sRemain.textContent=remain;sToday.textContent=data.today||0;sDone.textContent=done;sMiss.textContent=miss;
  statsDetail.innerHTML=`總筆數：${data.items.length}<br>待撥：${remain}<br>完成：${done}<br>未接：${miss}<br>今日撥打：${data.today||0}`;
}
function renderAll(){renderDial();renderList();renderStats()}
function showPage(name){
  ['Dial','List','Import','Stats'].forEach(n=>document.getElementById('page'+n).classList.toggle('hidden',n!==name));
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===name));
}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>showPage(b.dataset.page));
[cameraInput,imageInput].forEach(inp=>inp.onchange=()=>{const f=(cameraInput.files&&cameraInput.files[0])||(imageInput.files&&imageInput.files[0]);selectedFile.textContent=f?'已選擇：'+f.name:'尚未選擇圖片'});
ocrBtn.onclick=runOCR; importBtn.onclick=importOCR;
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
renderAll();
</script>
</body>
</html>
